# 1. HTTP Redirect to Canonical HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name careerpilot.website www.careerpilot.website 51.21.136.193 _;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://careerpilot.website$request_uri;
    }
}

# 2. Canonical 301 Redirect: www -> apex domain (prevents duplicate SEO indexing)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.careerpilot.website;

    ssl_certificate /etc/letsencrypt/live/careerpilot.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerpilot.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://careerpilot.website$request_uri;
}

# 3. HTTPS Main Production Server (Canonical Apex Domain)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name careerpilot.website 51.21.136.193 _;

    ssl_certificate /etc/letsencrypt/live/careerpilot.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerpilot.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Core Web Vitals & PageSpeed: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security & Trust Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;
    root /home/ubuntu/careerpilot/client/dist;

    # SEO / AEO / GEO Crawler Files (served directly with exact MIME types)
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        expires 1d;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
        expires 1d;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
        expires 1d;
    }

    # Serve static assets directly with immutable caching
    location /assets/ {
        alias /home/ubuntu/careerpilot/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Direct static file fallback for images, CSS, JS, WebP/AVIF
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|css|js|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API routes proxied to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Metrics route proxied to Gunicorn for Prometheus scraping
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin routes proxied to Gunicorn
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
