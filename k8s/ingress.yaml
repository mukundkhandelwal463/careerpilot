# ==============================================================================
# CareerPilot AWS Ingress (AWS ALB Controller Compatible)
# Reference: CareerPilot Project Synopsis Section 8 & Section 9
# Domain: careerpilot.website
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careerpilot-ingress
  namespace: careerpilot
  labels:
    app.kubernetes.io/name: careerpilot
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  rules:
    - host: careerpilot.website
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: careerpilot-backend-svc
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: careerpilot-backend-svc
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: careerpilot-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: careerpilot-frontend-svc
                port:
                  number: 80
