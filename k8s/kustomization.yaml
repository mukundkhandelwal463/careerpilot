# ==============================================================================
# CareerPilot Kubernetes Kustomization
# Enables one-command deployment: kubectl apply -k k8s/
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: careerpilot

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
